<div class="container">
  <div class="header">
    <h1>รวมรูปภาพเป็น PDF</h1>
  </div>

  <div class="upload-area"
       [class.disabled]="isProcessing"
       appDragDrop
       (fileDropped)="onFileDropped($event)">
    <input type="file"
           #cameraInput
           accept="image/*"
           capture="environment"
           (change)="onFileSelect($event)"
           [disabled]="isProcessing"
           style="display: none">
    
    <input type="file" 
           #fileInput 
           multiple 
           accept=".png,.PNG,.jpg,.JPG,.jpeg,.JPEG,image/png,image/jpeg,image/jpg" 
           (change)="onFileSelect($event)"
           [disabled]="isProcessing" 
           style="display: none">
    
    <div class="upload-buttons">
      <button mat-raised-button 
              color="primary"
              *ngIf="isMobile"
              [disabled]="isProcessing"
              (click)="cameraInput.click()">
        <mat-icon>camera_alt</mat-icon>
        ถ่ายรูป
      </button>

      <button mat-raised-button 
              color="primary"
              [disabled]="isProcessing" 
              (click)="fileInput.click()">
        <mat-icon>image</mat-icon>
        เลือกรูปภาพ
      </button>
    </div>
    
    <p>รองรับไฟล์: JPG, JPEG, PNG</p>
  </div>

  <div class="example-list" 
       cdkDropList 
       [cdkDropListData]="imageList"
       [cdkDropListDisabled]="isProcessing"
       (cdkDropListDropped)="drop($event)" 
       *ngIf="imageList.length > 0">
    <div class="example-box" 
         *ngFor="let fileModel of imageList; let i = index" 
         cdkDrag
         [cdkDragDisabled]="isProcessing">
      <div class="example-custom-placeholder" *cdkDragPlaceholder></div>
      <div class="sequence-number">{{i + 1}}</div>
      <div class="image-preview">
        <img [src]="fileModel.path" 
             [alt]="fileModel.name" 
             (click)="openImage(fileModel)">
      </div>
      <div class="filename">{{fileModel.name}}</div>
      <mat-icon class="drag-handle remove-icon" 
               [class.disabled]="isProcessing"
               (click)="removeImage(i)">close</mat-icon>
      <mat-icon class="drag-handle" *ngIf="!isMobile">drag_indicator</mat-icon>
    </div>
  </div>

  <div class="action-buttons" *ngIf="imageList.length > 1">
    <button mat-raised-button 
            color="accent"
            [disabled]="isProcessing"
            (click)="generatePDF()">
      <mat-icon>picture_as_pdf</mat-icon>
      สร้าง PDF
    </button>
  </div>

  <div class="errors" *ngIf="errors.length > 0">
    <p *ngFor="let error of errors" class="error-message">
      {{error}}
    </p>
  </div>

  <div class="processing-overlay" *ngIf="isProcessing">
    <div class="processing-content">
      <mat-spinner diameter="48"></mat-spinner>
      <p>กำลังสร้าง PDF...</p>
      <mat-progress-bar mode="determinate" [value]="currentProgress"></mat-progress-bar>
      <span>{{currentProgress.toFixed(0)}}%</span>
    </div>
  </div>
</div>
